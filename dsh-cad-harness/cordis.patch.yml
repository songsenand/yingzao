# dsh-cad-harness bundle patch.
#
# 1) Activate the host half.
# 2) Give the DeepSeek route a context-economy image budget.
#
# Image pruning (DESGIGN §12.3「图片修剪扩展」). The CAD loop re-sends the whole
# session history every step, and every `generate_part` result carries its own
# render views (4 images). Measured on this workspace's own telemetry
# (`data/usage/usage.jsonl`, 1094 conversation calls): image count per request
# reaches 88, i.e. ~88k image tokens in a single request, against ~168k text
# tokens — images were a quarter of the peak request and 25% of all tokens.
#
# The harness already implements exactly the planned policy — "old-turn images
# become a text placeholder" — in `offloadRequestImagesWithPolicy()`: the OLDEST
# images are replaced, in whole quanta, by `offloadedImageText(ref, access)`,
# which names the attachment AND its local normalized path, so the model can
# pull a pruned image back with `read_image` on demand. Nothing is lost.
#
# Defaults (600 images / step 20) are a *provider hard limit*, not context
# economy, so they never fire for a CAD session. These two knobs turn the same
# tested code path into the retention window the design asked for:
#
#   maxImagesPerRequest: 24      keep the newest 24 images = 6 render rounds
#   imageOffloadCountQuantum: 8  drop them in steps of 8 (2 rounds), so the
#                                removed prefix stays fixed for a while and the
#                                provider's prefix cache is not invalidated on
#                                every single step
#
# Resulting window: 17..24 images in flight, ~24k image tokens at worst instead
# of 88k. Keeping >=4 rounds in vision is the trigger line DESGIGN recorded.
#
# NOTE: a patch replaces the targeted row's whole `config`; both rows below have
# no config of their own (verified with `dsh --profile web --dump-config`), so
# nothing is clobbered. The `name` guard turns a drifted row id into a warning
# instead of a silent no-op. That guard has bitten once already: the row's
# bundle was renamed `@deepseek-ai/dsh-llm-deepseek` →
# `@deepseek-ai/dsh-llm-deepseek-api-key` in a dsh upgrade and this patch
# silently skipped until `scripts/accept-image-budget.mjs` caught it — run it
# after every dsh upgrade.
- insert:
    - id: cad-harness-host
      name: 'dsh-cad-harness'
      config:
        # Keep the CAD tool catalog out of sessions that did not ask for it.
        # This bundle mounts on the PROFILE plane, so its twelve tools would
        # otherwise land in every agent's request: measured from this
        # workspace's own durable request headers, a clean catalog is 27 tools
        # ~= 6,833 token and with the CAD catalog 38 tools ~= 11,449 token, on
        # every request. With `preset`, an agent whose session names a preset
        # other than the ones below gets them filtered out of its visible
        # catalog (`ctx.tools.restrict`), while the routes, the telemetry and
        # the browser panel stay global.
        #
        # ADOPTION COST: `agentPreset` is a session's creation fact (it may only
        # change while the session is blank), so turning this on strips the CAD
        # tools from every session that already exists. Install it when the CAD
        # work starts fresh. See src/host/tool-scope.ts.
        toolScope: preset
        presets:
          - cad

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    maxImagesPerRequest: 24
    imageOffloadCountQuantum: 8

# Replace the stock image-offload executor with the plugin's protected one.
# The stock `@deepseek-ai/dsh-compaction-image-offload` offloads the OLDEST
# retained occurrences with no exemption, so the user's reference image —
# always the oldest — is pruned first (measured on microscope3, DESGIGN §15.1).
# The plugin's executor (src/host/image-offload.ts) ports the stock behavior
# verbatim except that user-message TOP-LEVEL images are never selected; tool
# results stay fully prunable. Exactly one executor may own the `image/offload`
# seam, hence the disable — `scripts/accept-image-offload.mjs` verifies this
# row reads disabled after composition and that the plugin's projection is
# mounted instead.
- id: image-offload
  name: '@deepseek-ai/dsh-compaction-image-offload'
  disabled: true

# The pi-ai route (GLM and friends) has no count budget — only a per-provider
# `maxRequestImageBytes` — and its provider profiles are named by the user's
# settings document, so a static patch cannot address them. The host half
# applies that budget at boot (`src/host/image-budget.ts`); see DESGIGN §13.10.

# Ship the CAD agent preset from this repository, so "which sessions may call
# the CAD tools" is versioned with the plugin.
#
# In the current dsh a preset is a `@deepseek-ai/dsh-agent-preset` declaration
# row (see the web bundle's `presets/standard.patch.yml`); the old
# `@deepseek-ai/dsh-agent-presets` package with config-side `roots` no longer
# exists, and patching it here silently no-opped until the acceptance script
# caught that too. The declaration therefore lives in its own patch file —
# `presets/cad/preset.patch.yml`, generated from the installed standard
# composition by `scripts/sync-cad-preset.mjs` — and is applied because
# package.json lists it in `dsh.bundle.patch` right after this file.
