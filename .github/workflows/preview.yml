name: preview

# Trigger tiers (why: docs/DECISION-LOG.md 2026-11-25):
#   push main     fast gate, then full ubuntu acceptance. macOS/Windows wait for the nightly.
#   pull_request  fast gate only — the check a reviewer actually waits on.
#   tag v0.*      everything: full matrix, Windows smoke, CadQuery pack.
#   schedule      nightly full matrix + Windows smoke, 03:00 Asia/Shanghai.
#   dispatch      manual; behaves like a tag without cutting one.
on:
  push:
    branches: [main]
    tags: ['v0.*']
  pull_request:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. 19:00 UTC = 03:00 Asia/Shanghai. A failing nightly is
    # reported by GitHub to whoever last edited this cron line — keep it current.
    - cron: '0 19 * * *'

permissions:
  contents: read

# A newer push supersedes an in-flight run instead of queueing behind it.
# Tags are exempt: a release run must never be cancelled by an unrelated push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DSH_VERSION: 0.2.2-rc.1

jobs:
  # A 3–5 minute answer to "does it still typecheck and build?". Everything that
  # needs a built tree waits on this, so a broken build never burns a slow runner.
  fast:
    name: fast gate (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dsh-cad-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('dsh-cad-harness/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host + client + verify CLI
        run: npm run build
      - name: Root shim version matches package
        run: node scripts/sync-root-version.mjs --check

  # Job-level `if` cannot read matrix values, so the matrix is picked here:
  # ubuntu always, macOS only when the event is worth a 10x-minute runner.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.pick.outputs.verify }}
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        shell: bash
        run: |
          full="${{ github.event_name == 'schedule' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}"
          if [[ "$full" == "true" ]]; then
            echo 'os=["ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo 'verify=false' >> "$GITHUB_OUTPUT"
          else
            echo 'verify=true' >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: build + accept (${{ matrix.os }})
    needs: [fast, plan]
    if: needs.plan.outputs.verify == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    defaults:
      run:
        working-directory: dsh-cad-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('dsh-cad-harness/pnpm-lock.yaml') }}
      # The venv carries a lock-sha marker and `pythonRuntimeStatus()` re-checks it,
      # so a stale restore is repaired rather than trusted.
      - name: Cache Python runtime
        uses: actions/cache@v4
        with:
          path: ~/.dsh/cad/runtime
          key: cad-python-${{ runner.os }}-${{ hashFiles('dsh-cad-harness/src/host/python-lock.ts', 'dsh-cad-harness/src/host/python-runtime.ts', 'dsh-cad-harness/scripts/provision-python.mjs') }}
      - name: Cache OpenSCAD (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/.dsh/cad/tools
            ~/.dsh/cad/cache
            ~/.dsh/cad/backend.json
          key: cad-openscad-${{ runner.os }}-${{ hashFiles('dsh-cad-harness/scripts/provision-openscad.mjs') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host + client + verify CLI
        run: npm run build
      - name: Root shim version matches package
        run: node scripts/sync-root-version.mjs --check
      - name: Install dsh (preset source + doctor compatibility check)
        run: npm install -g @deepseek-ai/dsh@$DSH_VERSION
      - name: Accept A2 (preset path) / C1 (export gate) / A3 (backend) / C2 (verify CLI)
        run: |
          npm run accept:setup
          npm run accept:plugin-add -- --require
          npm run accept:export-gate
          npm run accept:backend
          npm run accept:verify-cli
      - name: Install OpenSCAD (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Install OpenSCAD (macOS)
        if: runner.os == 'macOS'
        run: node scripts/provision-openscad.mjs --source official
      - name: Setup checkout preset for this runner
        run: |
          STD="$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-web-app/presets/standard.patch.yml"
          test -f "$STD"
          node scripts/setup.mjs --openscad=off --standard "$STD"

      - name: Materialize the bundled Python runtime
        timeout-minutes: 40
        run: node scripts/provision-python.mjs

      - name: Full preview acceptance (P0 + P1 suites)
        run: |
          set -o pipefail
          npm run accept:preview 2>&1 | tee /tmp/accept.log
      - name: Publish acceptance failure summary
        if: failure()
        run: |
          tail -200 /tmp/accept.log >> "$GITHUB_STEP_SUMMARY"
          grep -E 'FAIL|SKIP' /tmp/accept.log | tail -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "::error::LAST-LINES"
          tail -12 /tmp/accept.log | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accept-log-${{ matrix.os }}
          path: /tmp/accept.log
          if-no-files-found: ignore

      - name: Doctor (fail only on kind=fail)
        run: |
          node scripts/doctor.mjs --json > doctor.json || true
          node -e 'const r=require("./doctor.json"); console.log("doctor:", r.kind); for(const c of r.checks||[]) if(c.status==="fail") console.log("::error::"+c.id+": "+c.detail+" (fix: "+(c.fix||"")+")"); if(r.kind==="fail") process.exit(1)'
      - name: Pack the preview tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
      - name: Clean install smoke (setup on the extracted tarball)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p /tmp/cad-smoke && tar -xzf artifacts/*.tgz -C /tmp/cad-smoke
          STD="$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-web-app/presets/standard.patch.yml"
          test -f "$STD"
          node /tmp/cad-smoke/package/scripts/setup.mjs --root /tmp/cad-smoke/package --standard "$STD" --openscad=off
          node /tmp/cad-smoke/package/scripts/setup.mjs --root /tmp/cad-smoke/package --standard "$STD" --openscad=off --check
          tar -xOzf artifacts/*.tgz package/presets/cad/preset.patch.yml > /tmp/preset-packed.yml
          if grep -q '/home/' /tmp/preset-packed.yml; then echo "packed preset leaked an absolute path"; exit 1; fi
          node /tmp/cad-smoke/package/scripts/doctor.mjs --root /tmp/cad-smoke/package --json > /tmp/doctor-packed.json || true
          node -e 'const r=require("/tmp/doctor-packed.json"); console.log("packed doctor:", r.kind); if(r.kind==="fail") process.exit(1)'
      - name: Upload tarball
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-cad-harness-preview
          path: dsh-cad-harness/artifacts/*.tgz

  # Nightly and release only: the Windows branch (PowerShell Expand-Archive) is
  # worth covering, but not on every commit.
  windows-smoke:
    name: install smoke (windows-latest)
    needs: [fast]
    if: github.event_name == 'schedule' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: dsh-cad-harness
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Cache OpenSCAD
        uses: actions/cache@v4
        with:
          path: |
            ~/.dsh/cad/tools
            ~/.dsh/cad/cache
            ~/.dsh/cad/backend.json
          key: cad-openscad-${{ runner.os }}-${{ hashFiles('dsh-cad-harness/scripts/provision-openscad.mjs') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host + client + verify CLI
        run: npm run build
      - name: Install dsh
        run: npm install -g @deepseek-ai/dsh@$DSH_VERSION
      # Exercises the Windows branch of the provisioner (PowerShell Expand-Archive),
      # which is the part no other job touches.
      - name: Provision OpenSCAD (windows)
        run: node scripts/provision-openscad.mjs --source official --json
      - name: Setup checkout preset for this runner
        run: |
          STD="$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-web-app/presets/standard.patch.yml"
          test -f "$STD"
          node scripts/setup.mjs --openscad=off --standard "$STD"
      # One suite per step: a failure then names the suite, and no tee/pipe can
      # break the step. The job log is the record; no artifact is uploaded.
      - name: accept:mirror-manifest
        run: npm run accept:mirror-manifest
      - name: accept:provision
        run: npm run accept:provision
      - name: accept:setup
        run: npm run accept:setup
      - name: accept:bundle-load
        run: npm run accept:bundle-load
      - name: accept:setup-kernel
        run: npm run accept:setup-kernel
      - name: accept:backend
        run: npm run accept:backend
      - name: accept:engine-seam
        run: npm run accept:engine-seam
      - name: accept:kernel-context
        run: npm run accept:kernel-context
      - name: accept:doctor
        run: npm run accept:doctor
      - name: Doctor (fail only on kind=fail)
        run: |
          node scripts/doctor.mjs --json > doctor.json || true
          node -e 'const r=require("./doctor.json"); console.log("doctor:", r.kind); for(const c of r.checks||[]) if(c.status==="fail") console.log("::error::"+c.id+": "+c.detail+" (fix: "+(c.fix||"")+")"); if(r.kind==="fail") process.exit(1)'

  cadquery:
    name: CadQuery pack (ubuntu-latest)
    # The 1.6 GiB pack is a release gate, not a per-commit tax.
    needs: [fast]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dsh-cad-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache Python runtime
        uses: actions/cache@v4
        with:
          path: ~/.dsh/cad/runtime
          key: cad-python-${{ runner.os }}-${{ hashFiles('dsh-cad-harness/src/host/python-lock.ts', 'dsh-cad-harness/src/host/python-runtime.ts', 'dsh-cad-harness/scripts/provision-python.mjs') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host + client + verify CLI
        run: npm run build
      - name: Materialize the bundled Python runtime
        timeout-minutes: 40
        run: node scripts/provision-python.mjs
      - name: Install OpenSCAD (CQ still renders through it)
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Install the pinned CadQuery pack
        run: |
          python -m pip install --disable-pip-version-check --no-deps --target .ci-cq-pack             'cadquery==2.8.0' 'cadquery-ocp==7.9.3.1.1' 'ezdxf==1.4.5'             'multimethod==1.12' 'nlopt==2.11.0' 'runtype==0.5.3' 'casadi==3.8.2'             'pyparsing==3.3.3' 'scipy==1.18.1' 'numba==0.68.1' 'llvmlite==0.50.0'             'vtk==9.6.2' 'numpy==2.5.5' 'typing_extensions==4.16.0'
      - name: accept:cadquery
        env:
          DSH_CAD_CQ_PACK: ${{ github.workspace }}/dsh-cad-harness/.ci-cq-pack
          DSH_CAD_REQUIRE_CQ: '1'
        run: npm run accept:cadquery
      - name: accept:cadquery-authoring
        env:
          DSH_CAD_CQ_PACK: ${{ github.workspace }}/dsh-cad-harness/.ci-cq-pack
          DSH_CAD_REQUIRE_CQ: '1'
        run: npm run accept:cadquery-authoring
      - name: accept:step-validation
        env:
          DSH_CAD_CQ_PACK: ${{ github.workspace }}/dsh-cad-harness/.ci-cq-pack
          DSH_CAD_REQUIRE_CQ: '1'
        run: npm run accept:step-validation
